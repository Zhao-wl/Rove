[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
# #76 发布流水线：更新清单的 ed25519 签名（私钥在仓库外）、SHA256 校验值、
# 图标 PNG 条目的 zlib 压缩，以及生成私钥用的系统随机数。
# 这些只在开发工具 xtask 里用，**不进 rove.exe**。
ed25519-dalek = "3.0.0"
flate2.workspace = true
getrandom = "0.4.3"
sha2 = "0.11.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
# 基准（`cargo xtask bench` 会调用 `cargo bench -p xtask --bench <name>`）。
# 关掉默认 feature（plotters / rayon）只保留 cargo bench 支持，减少编译量。
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
rove-base.workspace = true
rove-buffer.workspace = true
rove-config.workspace = true
rove-workspace.workspace = true
rove-lang-cs.workspace = true
rove-syntax.workspace = true
futures-lite = "2"
rove-test-support.workspace = true
rove-theme.workspace = true
# #18 列表基准、#19 的 scroll_unique 基准都在真实 GPUI 窗口里驱动 rove-ui
#（xtask 已登记在 .github/ui-crates.txt 中，允许依赖 gpui）。
rove-ui.workspace = true
rove-commands.workspace = true
rove-i18n.workspace = true
gpui.workspace = true
# #40 的 nav 基准在临时目录里生成 C# 项目与索引。
tempfile = "3"
# #25 全局搜索基准。
rove-search.workspace = true

[[bench]]
name = "text_source"
harness = false

[[bench]]
name = "workspace"
harness = false

[[bench]]
name = "cs_index"
harness = false

[[bench]]
name = "scroll_unique"
harness = false

[[bench]]
name = "cancellation"
harness = false

[[bench]]
name = "syntax"
harness = false

[[bench]]
name = "theme"
harness = false

[[bench]]
name = "lists"
harness = false

[[bench]]
name = "huge_file"
harness = false

[[bench]]
name = "outline"
harness = false

[[bench]]
name = "l1"
harness = false

[[bench]]
name = "edit"
harness = false

[[bench]]
name = "cs_router"
harness = false

[[bench]]
name = "find"
harness = false

[[bench]]
name = "quickopen"
harness = false

[[bench]]
name = "cs_overlay"
harness = false

[[bench]]
name = "nav"
harness = false

[[bench]]
name = "search"
harness = false

[[bench]]
name = "peek"
harness = false

# #47：按键到上屏（真实 GPUI 窗口，10 万行 C#，带语法着色）。
[[bench]]
name = "typing"
harness = false

# #55：粘性滚动每帧的额外开销（纯计算）。
[[bench]]
name = "sticky"
harness = false

# #58：软换行的换行点重算与视觉行映射（纯 CPU）。
[[bench]]
name = "wrap"
harness = false

# #60：转到工作区中的符号的每次按键（查询 + 列表行与高亮）。
[[bench]]
name = "workspace_symbols"
harness = false
