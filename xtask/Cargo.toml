[package]
name = "xtask"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "xtask"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

[dev-dependencies]
# 基准（`cargo xtask bench` 会调用 `cargo bench -p xtask --bench <name>`）。
# 关掉默认 feature（plotters / rayon）只保留 cargo bench 支持，减少编译量。
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
rove-base.workspace = true
rove-buffer.workspace = true
rove-config.workspace = true
rove-workspace.workspace = true
rove-lang-cs.workspace = true
rove-syntax.workspace = true
futures-lite = "2"
rove-test-support.workspace = true
rove-theme.workspace = true
# #18 列表基准（xtask 在 .github/ui-crates.txt 中，允许经 rove-ui 依赖 gpui）。
rove-ui.workspace = true

[[bench]]
name = "text_source"
harness = false

[[bench]]
name = "workspace"
harness = false

[[bench]]
name = "cs_index"
harness = false

[[bench]]
name = "scroll_unique"
harness = false

[[bench]]
name = "cancellation"
harness = false

[[bench]]
name = "syntax"
harness = false

[[bench]]
name = "theme"
harness = false

[[bench]]
name = "lists"
harness = false
