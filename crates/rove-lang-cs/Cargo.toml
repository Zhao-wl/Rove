[package]
name = "rove-lang-cs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rove-base.workspace = true
rove-syntax.workspace = true
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
# #36 索引生命周期：读取 rove.index.* 设置、缓存元数据、Windows 后台 I/O 优先级。
rove-config.workspace = true
serde_json.workspace = true
windows-sys.workspace = true
# #37 L1 声明索引：与 #9（rove-syntax）同一个 C# grammar 版本，直接解析，不经过高亮层。
tree-sitter.workspace = true
tree-sitter-c-sharp.workspace = true
memchr.workspace = true
# #38 查询路由：缓冲区快照（TextSource）与编辑记录。
rove-buffer.workspace = true

[dev-dependencies]
memory-stats = "1"
# #39 nav_check 运行器：读 tests/nav-cases/*.toml，写 JSON 结果文件。
rove-test-support.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
toml = "0.8"
rove-workspace.workspace = true
tempfile = "3"
