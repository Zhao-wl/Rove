[package]
name = "rove-ui"
build = "build.rs"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
rove-base.workspace = true
rove-buffer.workspace = true
rove-syntax.workspace = true
rove-theme.workspace = true
rove-config.workspace = true
rove-commands.workspace = true
rove-i18n.workspace = true
rove-workspace.workspace = true
rove-lang-cs.workspace = true
rove-docview.workspace = true
rove-fuzzy.workspace = true
rove-search.workspace = true
# #149：自动更新（联网只发生在这个 crate 里；rove-ui 只做命令、提示与「关于」里的状态）。
rove-update.workspace = true

gpui.workspace = true
serde_json.workspace = true
unicode-segmentation.workspace = true
memchr.workspace = true
fancy-regex.workspace = true
globset.workspace = true
async-channel.workspace = true
rayon.workspace = true
# #29 Markdown 预览。
pulldown-cmark.workspace = true
ammonia.workspace = true
flate2.workspace = true

[target.'cfg(windows)'.dependencies]
webview2-com.workspace = true
raw-window-handle = "0.6"
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Com",
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
# #47：组合中途点击 / 失焦时让输入法丢掉组合状态（ImmNotifyIME）。
windows-sys = { workspace = true, features = ["Win32_UI_Input_Ime", "Win32_UI_Input_KeyboardAndMouse", "Win32_Globalization"] }

[build-dependencies]
# #29：构建时压缩 Markdown 预览的打包资源（`build.rs`）。
flate2.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile = "3"
rove-test-support.workspace = true
futures-lite = "2"
# #74：no_network 入口测试要捕获被拒绝请求写出的日志。
log = "0.4"
