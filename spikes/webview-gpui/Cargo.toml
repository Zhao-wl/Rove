[package]
name = "webview-gpui"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
webview2-com = "=0.38.2"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_UI_Input_KeyboardAndMouse"] }
raw-window-handle = "0.6"
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
