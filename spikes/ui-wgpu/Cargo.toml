[package]
name = "ui-wgpu"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
winit = "0.30.13"
wgpu = { version = "30.0.1", default-features = false, features = ["dx12", "wgsl"] }
parley = "0.12"
swash = "0.2"
memmap2 = "0.9"
memchr = "2"
pollster = "0.4"
bytemuck = { version = "1", features = ["derive"] }

[profile.release]
lto = "thin"
codegen-units = 1
