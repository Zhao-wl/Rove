name: CI

# 约定见 AGENTS.md §10：本文件是所有会话共用的检查，改动前先看 issue #3。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消旧的运行，省 CI 时长（GPUI 的 clean build 实测 469 s）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust（fmt / clippy / test / 核心层禁 gpui）
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml 固定 stable-x86_64-pc-windows-msvc；gnu toolchain 编不过。
      - name: 安装工具链组件
        shell: pwsh
        run: |
          rustup show
          rustup component add rustfmt clippy

      # Cargo registry 与 target 缓存：命中率直接决定 CI 时长。
      - name: 缓存 Cargo 与 target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      # 放在 clippy 之前：一旦核心层误引入 gpui，先在这里失败，
      # 不必等编译 gpui（clean build 实测 469 s）。
      - name: 核心层禁止依赖 gpui
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/check-core-crates.ps1

      # #74：依赖图里不允许出现 HTTP / TLS 栈（reqwest / hyper / rustls / ring / tokio……）。
      # 和核心层检查一样只解析依赖图，不编译，所以放在 clippy 之前先失败。
      - name: 依赖图禁止 HTTP / TLS 栈
        run: cargo xtask check-deps

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # RUST_TEST_NOCAPTURE：让被跳过的 Unity 测试把「已跳过」写进 CI 日志。
        env:
          RUST_TEST_NOCAPTURE: 1
        run: cargo test --workspace

  eol:
    name: 行尾检查
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: git ls-files --eol
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/check-eol.ps1
      # #14：默认键位表由脚本从 VS Code 导出生成，生成物必须与源数据、判定规则一致
      - name: 默认键位表与源数据一致
        shell: pwsh
        run: python scripts/compat/gen_default_keybindings.py --check

  dotnet:
    name: C# 索引进程
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/rove-indexer-cs
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('tools/**/*.csproj', 'tools/**/*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: dotnet build -c Release
        run: dotnet build -c Release --nologo

  # 依赖许可（issue #76）：新增一个未登记许可的依赖，或忘了重新生成汇总表，都会失败。
  licenses:
    name: 依赖许可汇总
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 安装工具链
        shell: pwsh
        run: rustup show
      - uses: Swatinem/rust-cache@v2
        with:
          key: licenses
          cache-on-failure: true
      - name: cargo xtask licenses --check
        shell: pwsh
        run: |
          cargo xtask licenses --check 2>&1 | Tee-Object -FilePath licenses-report.txt
          $code = $LASTEXITCODE
          Get-Content licenses-report.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($code -ne 0) { exit $code }

  # 体积守护（issue #4 建立，#76 扩展到整个发布包）：每个 PR 都报告 rove.exe 与发布包的体积，
  # 发布包超过 perf/budgets.toml 的 [size].budget_bytes（30 MB）时失败。
  size:
    name: 体积守护（rove.exe 与发布包）
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 安装工具链组件
        shell: pwsh
        run: |
          rustup show
          rustup component add rustfmt clippy

      # 单独一个 cache key：release 构建与 debug 构建的产物不能混用。
      - name: 缓存 Cargo 与 target
        uses: Swatinem/rust-cache@v2
        with:
          key: size
          cache-on-failure: true

      # gpui 的着色器编译要调用 Windows SDK 的 fxc.exe；托管 runner 上不一定在 PATH 里。
      - name: 确保 fxc.exe 在 PATH 上
        shell: pwsh
        run: |
          if (Get-Command fxc.exe -ErrorAction SilentlyContinue) {
            Write-Host 'fxc.exe 已在 PATH 上'
            exit 0
          }
          $globs = @()
          if (${env:ProgramFiles(x86)}) { $globs += (Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin\*\x64\fxc.exe') }
          if ($env:ProgramFiles) { $globs += (Join-Path $env:ProgramFiles 'Windows Kits\10\bin\*\x64\fxc.exe') }
          $globs += 'D:\Windows Kits\10\bin\*\x64\fxc.exe'
          $fxc = Get-ChildItem -Path $globs -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1
          if (-not $fxc) { Write-Error '找不到 fxc.exe；gpui 无法编译着色器'; exit 1 }
          Write-Host "使用 $($fxc.FullName)"
          $fxc.Directory.FullName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - name: cargo build --release -p rove-app
        run: cargo build --release -p rove-app

      - name: 报告体积与发布包分项并检查预算
        shell: pwsh
        run: |
          cargo xtask check-size 2>&1 | Tee-Object -FilePath size-report.txt
          $code = $LASTEXITCODE
          Get-Content size-report.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
          if ($code -ne 0) { exit $code }

      # 冷启动到首帧：复用刚才构建的 release exe，读 FIRSTFRAME_SINCE_PROCESS_MS。
      # 托管 runner 上没有桌面会话时拿不到标记，脚本会跳过并返回 0（不阻断 CI）。
      - name: 冷启动到首帧
        shell: pwsh
        run: |
          cargo xtask startup --startup-tries 3 --startup-timeout 30 2>&1 | Tee-Object -FilePath startup-report.txt
          Get-Content startup-report.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
