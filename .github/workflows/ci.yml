name: CI

# 约定见 AGENTS.md §10：本文件是所有会话共用的检查，改动前先看 issue #3。
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消旧的运行，省 CI 时长（GPUI 的 clean build 实测 469 s）。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  rust:
    name: Rust（fmt / clippy / test / 核心层禁 gpui）
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml 固定 stable-x86_64-pc-windows-msvc；gnu toolchain 编不过。
      - name: 安装工具链组件
        shell: pwsh
        run: |
          rustup show
          rustup component add rustfmt clippy

      # Cargo registry 与 target 缓存：命中率直接决定 CI 时长。
      - name: 缓存 Cargo 与 target
        uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - name: cargo fmt --all --check
        run: cargo fmt --all --check

      # 放在 clippy 之前：一旦核心层误引入 gpui，先在这里失败，
      # 不必等编译 gpui（clean build 实测 469 s）。
      - name: 核心层禁止依赖 gpui
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/check-core-crates.ps1

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        # RUST_TEST_NOCAPTURE：让被跳过的 Unity 测试把「已跳过」写进 CI 日志。
        env:
          RUST_TEST_NOCAPTURE: 1
        run: cargo test --workspace

  eol:
    name: 行尾检查
    runs-on: windows-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: git ls-files --eol
        shell: pwsh
        run: pwsh -NoProfile -File .github/scripts/check-eol.ps1

  dotnet:
    name: C# 索引进程
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/rove-indexer-cs
    steps:
      - uses: actions/checkout@v4

      - name: 安装 .NET 9 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: 缓存 NuGet 包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('tools/**/*.csproj', 'tools/**/*.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: dotnet build -c Release
        run: dotnet build -c Release --nologo
