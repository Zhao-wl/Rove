project = "large"

# 大型 Unity 项目（约 2 万个 .cs）的 lambda / conditional / external / local /
# event / operator / indexer / type_ref 用例。
# 选点原则：每个查询点都要求“按名称解析必然出错”——同名符号分布在不同类型、
# 不同命名空间或不同条件编译分支里。期望值全部由人工阅读源码 + rg 全项目交叉核对得出。

