project = "medium"

# 中型 Unity 项目（GRF2Unity）的导航用例，分类：var / chain / overload / extension /
# generic / inheritance / interface / partial。
# 选点原则：每个查询点的成员名在项目里都有多个同名声明（rg -w 核对），按名称解析必然出错。
# 期望值全部由人工阅读源码推导，引用数用 rg -w 在 Assets + Packages + Library/PackageCache
# （索引实际编译的 7718 个文件所在的三个目录）范围内交叉核对。

