[workspace]
resolver = "2"
members = ["crates/*", "xtask"]
exclude = ["spikes"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "UNLICENSED"

[workspace.dependencies]
rove-buffer = { path = "crates/rove-buffer" }
rove-syntax = { path = "crates/rove-syntax" }
rove-workspace = { path = "crates/rove-workspace" }
rove-lang-cs = { path = "crates/rove-lang-cs" }
rove-docview = { path = "crates/rove-docview" }
rove-ui = { path = "crates/rove-ui" }
rove-test-support = { path = "crates/rove-test-support" }

rove-base = { path = "crates/rove-base" }
rove-theme = { path = "crates/rove-theme" }
rove-config = { path = "crates/rove-config" }
rove-commands = { path = "crates/rove-commands" }
rove-i18n = { path = "crates/rove-i18n" }

gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
# #7 文本缓冲：rope 快照、编码推断与解码。默认 feature 里的 unicode_lines 会把
# NEL/LS/PS 也当成换行，与 VS Code / 本项目的行终止符约定不一致，所以显式关掉。
ropey = { version = "1.6", default-features = false, features = ["cr_lines", "simd"] }
chardetng = "0.1"
encoding_rs = "0.8"
memchr = "2"
tree-sitter = "0.25"
tree-sitter-c-sharp = "0.23"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading"] }
fancy-regex = "0.20"
jsonc-parser = { version = "0.34", features = ["serde"] }
serde_json = "1.0"

tree-sitter-json = "0.24"
tree-sitter-yaml = "0.7"
tree-sitter-xml = "0.7"
tree-sitter-md = "0.5"
ignore = "0.4"
notify = "8"
globset = "0.4"
# #19 代码视图：按字素簇做命中测试与插入符移动（UAX #29）；#18 的列表过滤也用它。
unicode-segmentation = "1.12"

[profile.release]
lto = "thin"
codegen-units = 1
debug = "line-tables-only"

[patch.crates-io]
gpui = { path = "vendor/gpui" }
